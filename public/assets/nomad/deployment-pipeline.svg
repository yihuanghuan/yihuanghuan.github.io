<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">NoMaD deployment on TITA</title><desc id="desc">TITA captures camera frames and receives motion commands. A GPU laptop maintains visual context, runs NoMaD and converts waypoints to velocity commands. New camera observations close the loop.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#356b95"/></marker></defs>
<rect width="760" height="400" fill="white"/>
<g font-family="Arial, sans-serif" fill="#263746" text-anchor="middle">
<text x="380" y="28" font-size="20">From camera observations to physical motion</text>
<rect x="25" y="65" width="710" height="100" rx="3" fill="#f4f7f9" stroke="#ccd6dd"/>
<text x="106" y="99" font-size="18" font-weight="bold">TITA</text><text x="106" y="125" font-size="15">ROS 2 / Jetson</text>
<rect x="226" y="86" width="195" height="57" fill="white" stroke="#a7b2bb"/><text x="323" y="121" font-size="17">Camera observations</text>
<rect x="496" y="86" width="208" height="57" fill="white" stroke="#a7b2bb"/><text x="600" y="121" font-size="17">Chassis motion</text>
<rect x="25" y="237" width="710" height="135" rx="3" fill="#f4f7f9" stroke="#ccd6dd"/>
<text x="111" y="280" font-size="18" font-weight="bold">GPU laptop</text><text x="111" y="307" font-size="15">Policy + control</text>
<rect x="226" y="259" width="195" height="86" fill="white" stroke="#356b95"/><text x="323" y="286" font-size="17">4-frame context</text><text x="323" y="315" font-size="17">NoMaD inference</text>
<rect x="496" y="259" width="208" height="86" fill="white" stroke="#356b95"/><text x="600" y="286" font-size="17">Sampled waypoints</text><text x="600" y="315" font-size="17">Velocity controller</text>
<text x="240" y="203" font-size="15">JPEG / TCP</text><text x="670" y="203" font-size="15">v, ω / TCP</text>
</g>
